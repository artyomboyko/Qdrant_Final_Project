[project]
name = "qdrant-final-project"
version = "0.1.0"
description = "Hybrid retrieval and RAG research project for the Qdrant Essentials final project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "qdrant-client[fastembed-gpu]==1.19.0",
    "python-dotenv==1.2.3",
    "python-frontmatter==1.3.0",
    "markdown-it-py==4.2.0",
    "numpy",
    "pandas",
    "ranx",
]

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
