[project]
name = "qdrant-final-project"
version = "0.1.0"
description = "Qdrant Essentials final project: hybrid retrieval, reranking and RAG."
requires-python = ">=3.10,<3.11"

dependencies = [
    "qdrant-client[fastembed-gpu]==1.19.0",
    "python-dotenv==1.2.3",
    "python-frontmatter==1.3.0",
    "markdown-it-py==4.2.0",
    "plotly>=7.0.0",
    "ranx>=0.3.21",
    "pandas>=2.3.3",
    "tqdm>=4.70.0",
    "pillow>=12.3.0",
    "onnxruntime-gpu[cuda,cudnn]==1.23.2",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets>=8.1.9",
    "nbformat>=5.11.1",
]
